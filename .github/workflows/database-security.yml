name: Database Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: database-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grants-and-policies:
    name: Supabase grants and policies
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Test operational-table access boundary
        run: supabase test db --local supabase/tests/restrict_sensitive_table_api_access.test.sql
