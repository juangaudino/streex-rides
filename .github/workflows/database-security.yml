name: Database Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: database-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grants-and-policies:
    name: Supabase grants and policies
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: streex_security_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d streex_security_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Prepare isolated security fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d streex_security_test -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/restrict_sensitive_table_api_access.sql

      - name: Apply access-boundary migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d streex_security_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261020203512_restrict_sensitive_table_api_access.sql

      - name: Test operational-table access boundary
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d streex_security_test -v ON_ERROR_STOP=1 -f supabase/tests/restrict_sensitive_table_api_access.test.sql
